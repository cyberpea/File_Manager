rules:
  - id: ci-no-shell-true
    message: "Запрещён запуск системной оболочки: это путь к command injection."
    severity: ERROR
    languages:
      - python
    patterns:
      - pattern-either:
          - pattern: os.system(...)
          - pattern: os.popen(...)
          - pattern: subprocess.$FUNC(..., shell=True, ...)
    metadata:
      category: security
      confidence: HIGH

  - id: ci-no-eval-exec
    message: "Запрещены eval и exec: выполнение произвольного кода."
    severity: ERROR
    languages:
      - python
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
    metadata:
      category: security
      confidence: HIGH

  - id: ci-no-unsafe-pickle
    message: "Запрещена десериализация pickle: выполнение кода при загрузке."
    severity: ERROR
    languages:
      - python
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
    metadata:
      category: security
      confidence: HIGH

  - id: ci-no-unsafe-yaml
    message: "Запрещён yaml.load без безопасного Loader."
    severity: ERROR
    languages:
      - python
    pattern: yaml.load(...)
    metadata:
      category: security
      confidence: HIGH