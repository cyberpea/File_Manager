name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_IMAGE: file-manager:ci

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: python:3.14-slim
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: ${{ github.actor != 'nektos/act' }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        if: ${{ github.actor != 'nektos/act' }}
        with:
          path: .cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
      - name: Compile and package
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q file_manager main.py
          mkdir -p dist
          tar -czf dist/file-manager-src.tar.gz file_manager main.py requirements.txt
          ls -la dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ github.actor != 'nektos/act' }}
        with:
          name: build-artifacts
          path: dist/

  test:
    name: Test
    runs-on: ubuntu-latest
    container: python:3.14-slim
    needs: build
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: ${{ github.actor != 'nektos/act' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        if: ${{ github.actor != 'nektos/act' }}
        with:
          name: build-artifacts
          path: dist/
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        if: ${{ github.actor != 'nektos/act' }}
        with:
          path: .cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
      - name: Run unit tests
        run: |
          test -s dist/file-manager-src.tar.gz
          python -m pip install -r requirements.txt
          mkdir -p reports
          python -m pytest -v --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ github.actor != 'nektos/act' }}
        with:
          name: test-reports
          path: reports/junit.xml

  sast_semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: ${{ github.actor != 'nektos/act' }}
      - name: Scan source (block on High/Critical)
        run: |
          mkdir -p reports
          semgrep scan --config p/security-audit --config .semgrep/ci.yml \
            --no-git-ignore --severity ERROR --error \
            --sarif --output reports/semgrep.sarif .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ github.actor != 'nektos/act' }}
        with:
          name: semgrep-report
          path: reports/semgrep.sarif

  sast_trivy:
    name: SCA (Trivy)
    runs-on: ubuntu-latest
    container: aquasec/trivy
    needs: test
    env:
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: ${{ github.actor != 'nektos/act' }}
      - name: Scan dependencies (block on HIGH/CRITICAL)
        run: |
          mkdir -p reports
          trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --ignore-unfixed --format json --output reports/trivy.json .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ github.actor != 'nektos/act' }}
        with:
          name: trivy-report
          path: reports/trivy.json

  deploy:
    name: Local deploy
    runs-on: ubuntu-latest
    needs: [sast_semgrep, sast_trivy]
    env:
      DEPLOY_PORT: "18080"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: ${{ github.actor != 'nektos/act' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        if: ${{ github.actor != 'nektos/act' }}
        with:
          name: build-artifacts
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        if: ${{ github.actor != 'nektos/act' }}
        with:
          name: test-reports
          path: reports/
      - name: Ensure docker CLI
        run: |
          if command -v docker >/dev/null 2>&1; then
            docker version --format 'docker CLI {{.Client.Version}}'
          else
            apt-get update -qq && apt-get install -y -qq docker.io
          fi
      - name: Build image
        run: |
          test -s dist/file-manager-src.tar.gz
          docker build -t "$APP_IMAGE" .
      - name: Run container
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          test -n "$APP_SECRET" || { echo "APP_SECRET is not configured"; exit 1; }
          docker run -d --name fm-ci --rm \
            -p "$DEPLOY_PORT:8080" \
            -e "APP_SECRET=$APP_SECRET" \
            "$APP_IMAGE"
      - name: Smoke test
        run: |
          if [ "${GITHUB_ACTOR:-}" = "nektos/act" ]; then HOST=host.docker.internal; else HOST=127.0.0.1; fi
          mkdir -p reports
          for i in $(seq 1 30); do
            if curl -fsS "http://$HOST:$DEPLOY_PORT/healthz" > reports/health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat reports/health.json
          grep -q '"status": *"ok"' reports/health.json
      - name: Save image artifact
        run: |
          mkdir -p dist
          docker save "$APP_IMAGE" -o dist/file-manager-image.tar
          ls -lh dist/file-manager-image.tar
      - name: Stop container
        if: always()
        run: docker rm -f fm-ci 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ github.actor != 'nektos/act' }}
        with:
          name: deploy-artifacts
          path: |
            dist/file-manager-image.tar
            reports/health.json